openapi: 3.0.3
info:
  title: Exams API
  description: Dominio de exámenes, preguntas, resultados, diagnósticos y simulacros B2. Derivado del esquema PostgreSQL.
  version: 1.0.0
servers:
  - url: https://api.tudominio.com/v1
paths:
  /v1/exams:
    get:
      summary: Listar exámenes (paginado, filtro por nivel/publicado)
      operationId: listExams
      parameters:
        - { name: nivel, in: query, schema: { type: string } }
        - { name: publicado, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/Exam' } }
    post:
      summary: Crear examen
      operationId: createExam
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExamCreate' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Exam' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Código de examen duplicado (UNIQUE codigo), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/exams/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
    get:
      summary: Obtener examen
      operationId: getExam
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Exam' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Actualizar examen
      operationId: updateExam
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExamCreate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Exam' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Eliminar examen
      operationId: deleteExam
      responses: { '204': { description: Eliminado }, '404': { $ref: '#/components/responses/NotFound' } }
  /v1/exams/{id}/questions:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
    get:
      summary: Preguntas del examen (ordenadas)
      operationId: listExamQuestions
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Question' } } } } }
    post:
      summary: Añadir pregunta al examen
      operationId: addExamQuestion
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuestionCreate' } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/Question' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Orden duplicado en el examen (UNIQUE examen_id+orden), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/exams/results:
    post:
      summary: Registrar resultado de un examen
      operationId: createResult
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResultCreate' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Result' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/exams/results/users/{userId}:
    parameters: [ { name: userId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      summary: Resultados de un usuario
      operationId: listUserResults
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Result' } } } } }
  /v1/exams/diagnostics:
    post:
      summary: Registrar un diagnóstico B2
      operationId: createDiagnostic
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DiagnosticCreate' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Diagnostic' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/exams/simulations:
    post:
      summary: Registrar un simulacro B2
      operationId: createSimulation
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SimulationCreate' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Simulation' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
components:
  schemas:
    Exam:
      type: object
      required: [id, codigo, titulo, nivel, publicado, createdAt]
      properties:
        id: { type: integer, format: int64 }
        codigo: { type: string }
        titulo: { type: string }
        fecha: { type: string, format: date, nullable: true }
        nivel: { type: string }
        descripcion: { type: string, nullable: true }
        publicado: { type: boolean }
        articuloSlug: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ExamCreate:
      type: object
      required: [codigo, titulo]
      properties:
        codigo: { type: string }
        titulo: { type: string }
        fecha: { type: string, format: date }
        nivel: { type: string }
        descripcion: { type: string }
        publicado: { type: boolean }
        articuloSlug: { type: string }
    Question:
      type: object
      required: [id, examenId, orden, enunciado, opciones]
      properties:
        id: { type: integer, format: int64 }
        examenId: { type: integer, format: int64 }
        orden: { type: integer, minimum: 1 }
        enunciado: { type: string }
        opciones: { type: array, items: { type: string }, minItems: 2, maxItems: 8 }
        fuenteUrl: { type: string, nullable: true }
    QuestionCreate:
      type: object
      required: [orden, enunciado, opciones]
      properties:
        orden: { type: integer, minimum: 1 }
        enunciado: { type: string }
        opciones: { type: array, items: { type: string }, minItems: 2, maxItems: 8 }
        fuenteUrl: { type: string }
    Result:
      type: object
      required: [id, usuarioId, examenId, respuestas, aciertos, total, nota, fecha]
      properties:
        id: { type: integer, format: int64 }
        usuarioId: { type: string, format: uuid }
        examenId: { type: integer, format: int64 }
        respuestas: { type: object, additionalProperties: true }
        aciertos: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 1 }
        nota: { type: number, format: double, minimum: 0, maximum: 100 }
        fecha: { type: string, format: date-time }
    ResultCreate:
      type: object
      required: [usuarioId, examenId, respuestas, aciertos, total, nota]
      properties:
        usuarioId: { type: string, format: uuid }
        examenId: { type: integer, format: int64 }
        respuestas: { type: object, additionalProperties: true }
        aciertos: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 1 }
        nota: { type: number, format: double, minimum: 0, maximum: 100 }
    Diagnostic:
      type: object
      required: [id, usuarioId, aciertos, total, desglose, creadoEn]
      properties:
        id: { type: integer, format: int64 }
        usuarioId: { type: string, format: uuid }
        aciertos: { type: integer, minimum: 0, maximum: 40 }
        total: { type: integer, minimum: 1, maximum: 40 }
        desglose: { type: object, additionalProperties: true }
        creadoEn: { type: string, format: date-time }
    DiagnosticCreate:
      type: object
      required: [usuarioId, aciertos, total]
      properties:
        usuarioId: { type: string, format: uuid }
        aciertos: { type: integer, minimum: 0, maximum: 40 }
        total: { type: integer, minimum: 1, maximum: 40 }
        desglose: { type: object, additionalProperties: true }
    Simulation:
      type: object
      required: [id, usuarioId, modalidad, aciertos, total, creadoEn]
      properties:
        id: { type: integer, format: int64 }
        usuarioId: { type: string, format: uuid }
        modalidad: { type: string, enum: [use_of_english, listening] }
        aciertos: { type: integer, minimum: 0, maximum: 40 }
        total: { type: integer, minimum: 1, maximum: 40 }
        respuestas: { type: object, additionalProperties: true }
        duracionSegundos: { type: integer, minimum: 0, maximum: 7200 }
        creadoEn: { type: string, format: date-time }
    SimulationCreate:
      type: object
      required: [usuarioId, modalidad, aciertos, total]
      properties:
        usuarioId: { type: string, format: uuid }
        modalidad: { type: string, enum: [use_of_english, listening] }
        aciertos: { type: integer, minimum: 0, maximum: 40 }
        total: { type: integer, minimum: 1, maximum: 40 }
        respuestas: { type: object, additionalProperties: true }
        duracionSegundos: { type: integer, minimum: 0, maximum: 7200 }
    Error:
      type: object
      required: [code, message]
      properties: { code: { type: string }, message: { type: string } }
  responses:
    BadRequest: { description: Parámetros inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Recurso no encontrado, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
