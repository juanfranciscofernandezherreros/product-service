openapi: 3.0.3
info:
  title: Misc API (sugerencias, bitácora, writing)
  description: Dominios auxiliares — sugerencias, bitácora (categorías y anotaciones por usuario) y borradores de writing. Derivado del esquema PostgreSQL.
  version: 1.0.0
servers:
  - url: https://api.tudominio.com/v1
paths:
  /v1/suggestions:
    get:
      summary: Listar sugerencias (filtro por estado)
      operationId: listSuggestions
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [pendiente, publicada, rechazada] } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Suggestion' } } } } }
    post:
      summary: Crear sugerencia
      operationId: createSuggestion
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SuggestionCreate' } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/Suggestion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/suggestions/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
    get:
      summary: Obtener sugerencia
      operationId: getSuggestion
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Suggestion' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Cambiar estado de la sugerencia
      operationId: updateSuggestion
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [estado], properties: { estado: { type: string, enum: [pendiente, publicada, rechazada] } } } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Suggestion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/users/{userId}/logbook/categories:
    parameters: [ { name: userId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      summary: Categorías de bitácora del usuario
      operationId: listLogbookCategories
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LogbookCategory' } } } } }
    post:
      summary: Crear categoría de bitácora
      operationId: createLogbookCategory
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nombre], properties: { nombre: { type: string, minLength: 1, maxLength: 60 } } } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/LogbookCategory' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/users/{userId}/logbook/notes:
    parameters: [ { name: userId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      summary: Anotaciones de bitácora del usuario
      operationId: listLogbookNotes
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LogbookNote' } } } } }
    post:
      summary: Crear anotación de bitácora
      operationId: createLogbookNote
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LogbookNoteCreate' } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/LogbookNote' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/users/{userId}/writing-drafts:
    parameters: [ { name: userId, in: path, required: true, schema: { type: string, format: uuid } } ]
    get:
      summary: Borradores de writing del usuario
      operationId: listWritingDrafts
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WritingDraft' } } } } }
    post:
      summary: Crear borrador de writing
      operationId: createWritingDraft
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WritingDraftCreate' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/WritingDraft' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
components:
  schemas:
    Suggestion:
      type: object
      required: [id, titulo, descripcion, estado, creadoEn]
      properties:
        id: { type: integer, format: int64 }
        titulo: { type: string, minLength: 5, maxLength: 100 }
        descripcion: { type: string, minLength: 10, maxLength: 1000 }
        estado: { type: string, enum: [pendiente, publicada, rechazada] }
        creadoEn: { type: string, format: date-time }
    SuggestionCreate:
      type: object
      required: [titulo, descripcion]
      properties:
        titulo: { type: string, minLength: 5, maxLength: 100 }
        descripcion: { type: string, minLength: 10, maxLength: 1000 }
    LogbookCategory:
      type: object
      required: [id, usuarioId, nombre, creadoEn]
      properties:
        id: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        nombre: { type: string, minLength: 1, maxLength: 60 }
        creadoEn: { type: string, format: date-time }
    LogbookNote:
      type: object
      required: [id, usuarioId, contenido, creadoEn, actualizadoEn]
      properties:
        id: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        categoriaId: { type: string, format: uuid, nullable: true }
        contenido: { type: string, minLength: 1, maxLength: 10000 }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
    LogbookNoteCreate:
      type: object
      required: [contenido]
      properties:
        categoriaId: { type: string, format: uuid }
        contenido: { type: string, minLength: 1, maxLength: 10000 }
    WritingDraft:
      type: object
      required: [id, usuarioId, tipo, titulo, contenido, creadoEn, actualizadoEn]
      properties:
        id: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        tipo: { type: string, enum: [essay, article, review, email_informal, email_formal, report, story] }
        titulo: { type: string }
        contenido: { type: string }
        creadoEn: { type: string, format: date-time }
        actualizadoEn: { type: string, format: date-time }
    WritingDraftCreate:
      type: object
      required: [tipo]
      properties:
        tipo: { type: string, enum: [essay, article, review, email_informal, email_formal, report, story] }
        titulo: { type: string }
        contenido: { type: string }
    Error:
      type: object
      required: [code, message]
      properties: { code: { type: string }, message: { type: string } }
  responses:
    BadRequest: { description: Parámetros inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Recurso no encontrado, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
