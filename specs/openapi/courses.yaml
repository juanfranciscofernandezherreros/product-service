openapi: 3.0.3
info:
  title: Courses API
  description: Dominio de cursos, unidades, actividades y progreso. Derivado del esquema PostgreSQL.
  version: 1.0.0
servers:
  - url: https://api.tudominio.com/v1
paths:
  /v1/courses:
    get:
      summary: Listar cursos (filtro por activo)
      operationId: listCourses
      parameters:
        - { name: activo, in: query, schema: { type: boolean } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Course' } } } } }
    post:
      summary: Crear curso
      operationId: createCourse
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CourseCreate' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Course' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/courses/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
    get:
      summary: Obtener curso
      operationId: getCourse
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Course' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Actualizar curso
      operationId: updateCourse
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CourseCreate' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Course' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Eliminar curso
      operationId: deleteCourse
      responses: { '204': { description: Eliminado }, '404': { $ref: '#/components/responses/NotFound' } }
  /v1/courses/units:
    get:
      summary: Listar unidades (filtro por nivel/publicado)
      operationId: listUnits
      parameters:
        - { name: nivel, in: query, schema: { type: string } }
        - { name: publicado, in: query, schema: { type: boolean } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Unit' } } } } }
    post:
      summary: Crear unidad
      operationId: createUnit
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UnitCreate' } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/Unit' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Slug de unidad duplicado (UNIQUE slug), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/courses/units/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
    get:
      summary: Obtener unidad
      operationId: getUnit
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Unit' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/courses/activities:
    get:
      summary: Listar actividades (filtro por destreza/publicado)
      operationId: listActivities
      parameters:
        - { name: destreza, in: query, schema: { type: string, enum: [reading, use_of_english, writing, listening, speaking, vocabulary, grammar] } }
        - { name: publicado, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/Activity' } }
    post:
      summary: Crear actividad
      operationId: createActivity
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityCreate' } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/Activity' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Slug de actividad duplicado (UNIQUE slug), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/courses/activities/{id}:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
    get:
      summary: Obtener actividad
      operationId: getActivity
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Activity' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/courses/activities/{id}/questions:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
    get:
      summary: Preguntas de una actividad (ordenadas)
      operationId: listActivityQuestions
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ActivityQuestion' } } } } }
    post:
      summary: Añadir pregunta a la actividad
      operationId: addActivityQuestion
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityQuestionCreate' } } } }
      responses:
        '201': { description: Creada, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityQuestion' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Orden duplicado en la actividad (UNIQUE actividad_id+orden), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/courses/activities/{id}/attempts:
    parameters: [ { name: id, in: path, required: true, schema: { type: integer, format: int64 } } ]
    post:
      summary: Registrar un intento de actividad
      operationId: createActivityAttempt
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityAttemptCreate' } } } }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityAttempt' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  schemas:
    Course:
      type: object
      required: [id, nombre, activo, creadoEn]
      properties:
        id: { type: integer, format: int64 }
        nombre: { type: string, minLength: 1 }
        descripcion: { type: string, nullable: true }
        activo: { type: boolean }
        creadoEn: { type: string, format: date-time }
    CourseCreate:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string, minLength: 1 }
        descripcion: { type: string }
        activo: { type: boolean }
    Unit:
      type: object
      required: [id, slug, titulo, nivel, orden, publicado]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        titulo: { type: string }
        descripcion: { type: string, nullable: true }
        nivel: { type: string }
        orden: { type: integer }
        publicado: { type: boolean }
    UnitCreate:
      type: object
      required: [slug, titulo, nivel]
      properties:
        slug: { type: string }
        titulo: { type: string }
        descripcion: { type: string }
        nivel: { type: string }
        orden: { type: integer }
        publicado: { type: boolean }
    Activity:
      type: object
      required: [id, slug, titulo, destreza, orden, publicado, creadoEn]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,99}$' }
        titulo: { type: string }
        descripcion: { type: string, nullable: true }
        destreza: { type: string, enum: [reading, use_of_english, writing, listening, speaking, vocabulary, grammar] }
        unidadId: { type: integer, format: int64, nullable: true }
        articuloSlug: { type: string, nullable: true }
        orden: { type: integer }
        publicado: { type: boolean }
        creadoEn: { type: string, format: date-time }
    ActivityCreate:
      type: object
      required: [slug, titulo, destreza]
      properties:
        slug: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,99}$' }
        titulo: { type: string }
        descripcion: { type: string }
        destreza: { type: string, enum: [reading, use_of_english, writing, listening, speaking, vocabulary, grammar] }
        unidadId: { type: integer, format: int64 }
        articuloSlug: { type: string }
        orden: { type: integer }
        publicado: { type: boolean }
    ActivityQuestion:
      type: object
      required: [id, actividadId, orden, tipo, enunciado, configuracion]
      properties:
        id: { type: integer, format: int64 }
        actividadId: { type: integer, format: int64 }
        orden: { type: integer, minimum: 1 }
        tipo: { type: string, enum: [seleccion, texto_corto, huecos, transformacion, redaccion] }
        enunciado: { type: string }
        configuracion: { type: object, additionalProperties: true }
        medioTipo: { type: string, enum: [audio, imagen], nullable: true }
        medioUrl: { type: string, nullable: true }
        medioAlt: { type: string, nullable: true }
    ActivityQuestionCreate:
      type: object
      required: [orden, tipo, enunciado]
      properties:
        orden: { type: integer, minimum: 1 }
        tipo: { type: string, enum: [seleccion, texto_corto, huecos, transformacion, redaccion] }
        enunciado: { type: string }
        configuracion: { type: object, additionalProperties: true }
        medioTipo: { type: string, enum: [audio, imagen] }
        medioUrl: { type: string }
        medioAlt: { type: string }
    ActivityAttempt:
      type: object
      required: [id, usuarioId, actividadId, respuestas, detalle, aciertos, evaluables, pendientesRevision, fecha]
      properties:
        id: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        actividadId: { type: integer, format: int64 }
        respuestas: { type: object, additionalProperties: true }
        detalle: { type: object, additionalProperties: true }
        aciertos: { type: integer, minimum: 0 }
        evaluables: { type: integer, minimum: 0 }
        pendientesRevision: { type: integer, minimum: 0 }
        fecha: { type: string, format: date-time }
    ActivityAttemptCreate:
      type: object
      required: [usuarioId, respuestas, detalle, aciertos, evaluables, pendientesRevision]
      properties:
        usuarioId: { type: string, format: uuid }
        respuestas: { type: object, additionalProperties: true }
        detalle: { type: object, additionalProperties: true }
        aciertos: { type: integer, minimum: 0 }
        evaluables: { type: integer, minimum: 0 }
        pendientesRevision: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [code, message]
      properties: { code: { type: string }, message: { type: string } }
  responses:
    BadRequest: { description: Parámetros inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Recurso no encontrado, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
