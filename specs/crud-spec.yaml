openapi: 3.0.3
info:
  title: Product CRUD API
  version: 1.0.0
  description: Especificación contractual para el CRUD de Productos en Java 21 con PostgreSQL vía Docker.
paths:
  /api/v1/products:
    post:
      summary: Create a new product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Invalid input
    get:
      summary: List all products
      operationId: getAllProducts
      responses:
        '200':
          description: List of products
  /api/v1/products/{id}:
    get:
      summary: Get product by ID
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product found
        '404':
          description: Product not found
    put:
      summary: Update product
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductRequest'
      responses:
        '200':
          description: Product updated
    delete:
      summary: Delete product
      operationId: deleteProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Product deleted
components:
  schemas:
    ProductRequest:
      type: object
      required: [sku, name, price]
      properties:
        sku:
          type: string
          minLength: 3
          example: "PROD-001"
        name:
          type: string
          minLength: 2
          example: "Mechanical Keyboard"
        price:
          type: number
          format: double
          minimum: 0.01
          example: 99.99
    ProductResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        price:
          type: number
          format: double
