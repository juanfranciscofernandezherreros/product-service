services:
  postgres:
    image: postgres:16
    container_name: battle-service-postgres
    environment:
      POSTGRES_DB: battle_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - battle_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d battle_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  battle_db_data:
