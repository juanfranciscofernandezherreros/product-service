openapi: 3.0.3
info:
  title: API de Gestión de Fondos de Inversión (CRUD Completo)
  description: API REST para la gestión integral de fondos de inversión, valores liquidativos y operaciones.
  version: 1.1.0
servers:
  - url: https://api.tudominio.com/v1
    description: Servidor de Producción
  - url: https://sandbox.tudominio.com/v1
    description: Servidor de Pruebas (Sandbox)

paths:
  /funds:
    get:
      summary: Listar fondos de inversión (READ - Collection)
      description: Obtiene un listado paginado de los fondos con filtros opcionales.
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: currency
          in: query
          schema:
            type: string
            example: EUR
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Lista obtenida correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FundSummary'

    post:
      summary: Crear un nuevo fondo de inversión (CREATE)
      description: Da de alta un nuevo fondo de inversión en el sistema utilizando su código ISIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundCreateRequest'
      responses:
        '201':
          description: Fondo creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Ya existe un fondo registrado con el mismo ISIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /funds/{isin}:
    get:
      summary: Obtener detalle de un fondo (READ - Item)
      description: Recupera la información detallada de un fondo específico por su ISIN.
      parameters:
        - name: isin
          in: path
          required: true
          schema:
            type: string
            example: ES0123456789
      responses:
        '200':
          description: Detalle obtenido con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundDetail'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Actualizar un fondo de inversión (UPDATE)
      description: Modifica los datos descriptivos, comisiones o riesgo de un fondo existente.
      parameters:
        - name: isin
          in: path
          required: true
          schema:
            type: string
            example: ES0123456789
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FundUpdateRequest'
      responses:
        '200':
          description: Fondo actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Eliminar o dar de baja un fondo (DELETE)
      description: Elimina o marca como inactivo un fondo de inversión del sistema.
      parameters:
        - name: isin
          in: path
          required: true
          schema:
            type: string
            example: ES0123456789
      responses:
        '204':
          description: Fondo eliminado correctamente (sin contenido)
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: No se puede eliminar el fondo porque tiene posiciones de clientes activas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /funds/{isin}/nav:
    get:
      summary: Consultar histórico del Valor Liquidativo (NAV)
      parameters:
        - name: isin
          in: path
          required: true
          schema:
            type: string
            example: ES0123456789
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Serie histórica obtenida
          content:
            application/json:
              schema:
                type: object
                properties:
                  isin:
                    type: string
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/NavPoint'

  /orders:
    post:
      summary: Emitir orden de suscripción o reembolso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Orden registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'

components:
  schemas:
    FundSummary:
      type: object
      properties:
        isin:
          type: string
          example: ES0123456789
        name:
          type: string
          example: "Global Growth FI"
        category:
          type: string
          example: "Renta Variable Internacional"
        currency:
          type: string
          example: "EUR"
        currentNav:
          type: number
          format: float
          example: 15.4231

    FundDetail:
      allOf:
        - $ref: '#/components/schemas/FundSummary'
        - type: object
          properties:
            riskLevel:
              type: integer
              minimum: 1
              maximum: 7
              example: 5
            managementFee:
              type: number
              format: float
              example: 1.35
            depositaryFee:
              type: number
              format: float
              example: 0.10
            assetsUnderManagement:
              type: number
              format: float
              example: 45000000.50
            description:
              type: string
              example: "Fondo enfocado en tecnología."

    FundCreateRequest:
      type: object
      required:
        - isin
        - name
        - category
        - currency
        - riskLevel
      properties:
        isin:
          type: string
          example: ES0123456789
        name:
          type: string
          example: "Global Growth FI"
        category:
          type: string
          example: "Renta Variable Internacional"
        currency:
          type: string
          example: "EUR"
        riskLevel:
          type: integer
          minimum: 1
          maximum: 7
          example: 5
        managementFee:
          type: number
          format: float
          example: 1.35
        depositaryFee:
          type: number
          format: float
          example: 0.10
        description:
          type: string
          example: "Fondo enfocado en tecnología."

    FundUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: "Global Growth FI Actualizado"
        category:
          type: string
          example: "Renta Variable Global"
        riskLevel:
          type: integer
          example: 6
        managementFee:
          type: number
          format: float
          example: 1.25
        depositaryFee:
          type: number
          format: float
          example: 0.08
        description:
          type: string
          example: "Descripción actualizada del fondo."

    NavPoint:
      type: object
      properties:
        date:
          type: string
          format: date
          example: "2026-11-06"
        nav:
          type: number
          format: float
          example: 15.4012

    OrderRequest:
      type: object
      required:
        - accountId
        - isin
        - operationType
        - amount
      properties:
        accountId:
          type: string
          example: "ES91-2100-0000-1234567890"
        isin:
          type: string
          example: "ES0123456789"
        operationType:
          type: string
          enum: [SUBSCRIPTION, REDEMPTION]
          example: "SUBSCRIPTION"
        amount:
          type: number
          format: float
          example: 1000.00
        currency:
          type: string
          default: "EUR"

    OrderResponse:
      type: object
      properties:
        orderId:
          type: string
          format: uuid
          example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
        status:
          type: string
          enum: [PENDING, EXECUTED, REJECTED]
          example: "PENDING"
        createdAt:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        code:
          type: string
          example: "RESOURCE_ALREADY_EXISTS"
        message:
          type: string
          example: "Ya existe un fondo con el ISIN proporcionado."

  responses:
    BadRequest:
      description: Parámetros inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Fondo no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
