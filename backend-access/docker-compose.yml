services:
  postgres:
    image: postgres:16
    container_name: access-service-postgres
    environment:
      POSTGRES_DB: access_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - access_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d access_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  access_db_data:
