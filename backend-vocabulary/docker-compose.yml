services:
  postgres:
    image: postgres:16
    container_name: vocabulary-service-postgres
    environment:
      POSTGRES_DB: vocabulary_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vocabulary_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vocabulary_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vocabulary_db_data:
