services:
  postgres:
    image: postgres:16
    container_name: study-plan-service-postgres
    environment:
      POSTGRES_DB: study_plan_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - study_plan_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d study_plan_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  study_plan_db_data:
